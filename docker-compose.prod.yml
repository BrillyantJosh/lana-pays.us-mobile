version: "3.8"

services:
  lana-pays-mobile-web:
    build: .
    container_name: lana-pays-mobile-web
    restart: unless-stopped
    env_file:
      - .env
      - .env.local
    environment:
      - VIRTUAL_HOST=mobile.lanapays.us
      - VIRTUAL_PORT=3005
      - LETSENCRYPT_HOST=mobile.lanapays.us
      - LETSENCRYPT_EMAIL=josh@lanaworld.app
      - DIRECT_FUND_URL=http://lana-direct-fund-web:3005
      # The service key for brain's read-only /api/peer/merchant-usage. This
      # heartbeat used to reach brain's ADMIN api carrying a person's Nostr key
      # in x-admin-hex-id — a machine authenticating as a person — and brain's
      # KIND 87058 gate rightly refuses that key now. This is the replacement,
      # and it is the only credential the sync has: unset means
      # quota_volume_used / quota_tx_used stop refreshing and the cash
      # pre-flight judges merchants on stale numbers, loudly. Must equal
      # PEER_API_KEY (or PURCHASE_API_KEY) in lana-brain's .env.
      #
      # Listed here as well as arriving through env_file above, so the variable
      # this container needs is visible in the compose file rather than only in
      # a .env nobody opens. Compose interpolates it from THIS directory's .env
      # — the same file env_file names — so put it there, not in .env.local.
      - BRAIN_PEER_KEY=${BRAIN_PEER_KEY:-}
    volumes:
      - ./data:/app/data
    networks:
      - webproxy

networks:
  webproxy:
    external: true
